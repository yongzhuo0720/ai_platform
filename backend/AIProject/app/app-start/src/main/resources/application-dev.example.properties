####################################################
#  \u914d\u7f6e\u6a21\u677f\uff082026-10-29 \u65b0\u589e\uff09
#
#  \u7528\u6cd5\uff1a\u590d\u5236\u672c\u6587\u4ef6\u4e3a application-dev.properties\uff0c\u518d\u586b\u5165\u672c\u673a\u771f\u5b9e\u503c\u3002
#        application-dev.properties \u5df2\u88ab .gitignore \u5ffd\u7565\uff0c\u4e0d\u4f1a\u8fdb\u7248\u672c\u5e93\u3002
#
#  \u4e3a\u4ec0\u4e48\u8981\u6709\u8fd9\u4e2a\u6587\u4ef6\uff1a
#    \u539f\u6765 application-dev.properties \u5e26\u7740\u660e\u6587\u53e3\u4ee4\u88ab\u63d0\u4ea4\u8fdb\u4e86 git\u3002
#    \u867d\u7136\u5b83\u6307\u5411\u7684\u662f 127.0.0.1 \u672c\u673a\uff08\u4e0d\u53ef\u88ab\u8fdc\u7a0b\u5229\u7528\uff09\uff0c
#    \u4f46\u53ea\u8981\u6709\u4eba\u628a datasource.ip / redis.host \u6539\u6210\u771f\u5b9e\u670d\u52a1\u5668\u5730\u5740\uff0c
#    \u660e\u6587\u53e3\u4ee4\u5c31\u4f1a\u548c\u771f\u5b9e\u76ee\u6807\u7ed1\u5b9a\u5e76\u91cd\u65b0\u5165\u5e93\u3002
#    \u6240\u4ee5\u628a\u6a21\u677f\u548c\u771f\u503c\u62c6\u5f00\u3002
#
#  \u9700\u8981\u5916\u90e8\u6ce8\u5165\u7684\u73af\u5883\u53d8\u91cf\uff1a
#    AI_DB_USERNAME   PostgreSQL 应用账号（默认 ai_app，见下面数据库配置）
#    AI_DB_PASSWORD   PostgreSQL 口令（对应 hnsp.datasource.password）
#    REDIS_PASSWORD   Redis 口令（对应 hnsp.redis.password）
#  其余 Dify / Agent 相关密钥已使用 ${XXX:} 占位，保持原样即可。
####################################################

#                     \u5F00\u53D1\u73AF\u5883                      #
#                     V1.0.0                       #
# \u6700\u540E\u4FEE\u6539\u65F6\u95F4\uFF1A2021.06.06                           #
# \u7EF4\u62A4\u8005     \uFF1ANexusAI Team                              #
####################################################

#============= \u670D\u52A1\u914D\u7F6E    ==========================
server.port=8507
server.servlet.context-path=/ai

# swagger\u5F00\u5173
swagger.enable=true

# \u65E5\u5FD7
# \u65e5\u5fd7\u7ea7\u522b\u3002
# \u4e0d\u8981\u7528 debug\uff1a\u6846\u67b6\u4f1a\u628a\u6bcf\u6761 SQL\uff08\u542b\u5168\u90e8\u53c2\u6570\uff09\u6253\u6210 DEBUG\uff0c
# \u5b9e\u6d4b 1 \u5c0f\u65f6 40 \u5206\u949f\u8f93\u51fa 74 \u4e07\u5b57\u7b26\u3001\u65e5\u5fd7\u6587\u4ef6 892K\uff0c
# \u8fdb\u7a0b\u4f1a\u56e0\u8f93\u51fa\u7f13\u51b2\u88ab\u6491\u7206\u800c\u4e2d\u6b62\u3002
# \u9700\u8981\u770b SQL \u65f6\u4e34\u65f6\u6539\u6210 debug\uff0c\u6392\u67e5\u5b8c\u7acb\u523b\u6539\u56de info\u3002
logging.level.com=info

#============= \u6570\u636E\u5E93\u914D\u7F6E    ==========================
# \u4E0D\u8981\u7528\u8D85\u7EA7\u7528\u6237 postgres \u8FDE\u5E93\u3002\u5E94\u7528\u8D26\u53F7\u7528 scripts/sql/create-app-role.sql \u521B\u5EFA\u7684 ai_app\uFF1A
# \u975E superuser\u3001\u4E0D\u80FD CREATE ROLE / CREATE DATABASE\uFF0C\u8BFB\u4E0D\u4E86 pg_authid\uFF0C
# \u4F46 public \u4E0B\u7684\u8868\u4E0E\u5E8F\u5217\u5F52\u5C5E\u5B83\uFF0C\u6240\u4EE5\u542F\u52A8\u671F TableSchemaInitializer \u7684
# ALTER TABLE / CREATE INDEX \u4ECD\u7136\u505A\u5F97\u52A8\uFF08\u53EA\u7ED9\u589E\u5220\u6539\u67E5\u4E0D\u591F\uFF0CDDL \u5FC5\u987B\u662F owner\uFF1B
# \u800C\u4E14\u90A3\u6279 DDL \u5931\u8D25\u53EA\u6253 WARN\uFF0C\u6743\u9650\u4E0D\u8DB3\u65F6\u5E94\u7528\u7167\u6837\u542F\u52A8\u3001\u7D22\u5F15\u4E0E\u957F\u6587\u672C\u5217\u5374\u9759\u9ED8\u7F3A\u5931\uFF09\u3002
hnsp.datasource.ip=127.0.0.1:5432
hnsp.datasource.username=${AI_DB_USERNAME:ai_app}
hnsp.datasource.password=${AI_DB_PASSWORD:}

#============= redis\u5E93\u914D\u7F6E    ==========================
hnsp.redis.host=127.0.0.1
hnsp.redis.port=6379
hnsp.redis.password=${REDIS_PASSWORD:}

#============= \u4E1A\u52A1\u914D\u7F6E ==========================
# \u7528\u6237\u767B\u5F55token\u6709\u6548\u65F6\u95F4
hnsp.business.userlogin.tokenTime=1800
hnsp.business.userlogin.tokenTimeLong=604800
hnsp.business.userlogin.duplicate=true

##========== \u5F02\u6B65\u7EBF\u7A0B\u914D\u7F6E  ============================
# \u914D\u7F6E\u6838\u5FC3\u7EBF\u7A0B\u6570
async.executor.thread.core_pool_size = 5
# \u914D\u7F6E\u6700\u5927\u7EBF\u7A0B\u6570
async.executor.thread.max_pool_size = 5
# \u914D\u7F6E\u961F\u5217\u5927\u5C0F
async.executor.thread.queue_capacity = 99999
# \u914D\u7F6E\u7EBF\u7A0B\u6C60\u4E2D\u7684\u7EBF\u7A0B\u7684\u540D\u79F0\u524D\u7F00
async.executor.thread.name.prefix = async-service-

#============= AI \u7f51\u5173\u914d\u7f6e ==========================
# \u603b\u5f00\u5173\uff1b\u5173\u95ed\u540e /api/aiGateway/** \u76f4\u63a5\u8fd4\u56de 503
ai.gateway.enabled=true
# \u6bcf\u7528\u6237\u6bcf\u5206\u949f\u6700\u5927\u8bf7\u6c42\u6570\uff08\u6240\u6709\u6a21\u5757\uff09\uff0c<=0 \u4e0d\u9650\u5236
ai.gateway.rate-limit-per-minute=120
# \u9ed8\u8ba4\u6bcf\u65e5 Token \u914d\u989d\uff08chat / knowledgeChat / models \u76f4\u8fde\uff09\uff0c<=0 \u4e0d\u9650\u5236
ai.gateway.default-daily-token-quota=200000
# \u6bcf\u6b21\u8bf7\u6c42\u5f00\u59cb\u524d\u9884\u6263\u7684 Token \u6570\uff0c<=0 \u5173\u95ed\u9884\u6263\uff08\u9000\u56de\u5b8c\u6210\u540e\u8ba1\u8d39\uff09
ai.gateway.quota-reserve-tokens=1500
# \u8fde\u63a5 / \u8bfb\u53d6 Dify \u7684\u8d85\u65f6\uff08\u6beb\u79d2\uff09\uff1b\u6d41\u5f0f\u5bf9\u8bdd\u9700\u8981\u8f83\u957f\u8bfb\u53d6\u8d85\u65f6
ai.gateway.connect-timeout-ms=10000
ai.gateway.read-timeout-ms=300000
# \u5355\u4E2A\u6A21\u5757\u540C\u65F6\u8FDB\u884C\u4E2D\u7684\u4E0A\u6E38\u8BF7\u6C42\u4E0A\u9650\uFF08\u5355\u5B9E\u4F8B\uFF09\uFF0C<=0 \u4E0D\u9650\u5236\uFF1B\u8D85\u9650\u76F4\u63A5 429\uFF0C\u4E0D\u6392\u961F
ai.gateway.max-concurrent-per-module=32
# \u5355\u6B21\u6D41\u5F0F / \u900F\u4F20\u54CD\u5E94\u7684\u603B\u65F6\u957F\u4E0A\u9650\uFF08\u6BEB\u79D2\uFF09\uFF0C<=0 \u4E0D\u9650\u5236
ai.gateway.max-stream-ms=600000
# \u6D41\u5F0F\u54CD\u5E94\u7A7A\u95F2\u65F6\u53D1\u9001\u5FC3\u8DF3\u7684\u95F4\u9694\uFF08\u6BEB\u79D2\uFF09\uFF0C<=0 \u4E0D\u53D1\u5FC3\u8DF3
ai.gateway.sse-heartbeat-ms=15000
# \u540C\u4E00\u4E0A\u6E38\u8FDE\u7EED\u5931\u8D25\u591A\u5C11\u6B21\u540E\u7194\u65AD\uFF0C<=0 \u5173\u95ED\u7194\u65AD\uFF1B\u53EA\u7EDF\u8BA1\u8FDE\u63A5\u5931\u8D25\u3001\u8BFB\u8D85\u65F6\u4E0E 5xx
ai.gateway.circuit-failure-threshold=5
# \u7194\u65AD\u51B7\u5374\u65F6\u95F4\uFF08\u6BEB\u79D2\uFF09\uFF0C\u671F\u95F4\u65B0\u8BF7\u6C42\u76F4\u63A5 503\uFF0C\u7ED3\u675F\u540E\u53EA\u653E\u4E00\u4E2A\u534A\u5F00\u63A2\u9488
ai.gateway.circuit-open-ms=30000
# \u534A\u5F00\u63A2\u9488\u6700\u957F\u7B49\u5F85\u65F6\u95F4\uFF08\u6BEB\u79D2\uFF09\uFF0C\u8D85\u65F6\u6309\u5931\u8D25\u5904\u7406\u5E76\u91CD\u65B0\u51B7\u5374\uFF1B\u5E94\u5C0F\u4E8E\u4E0A\u6E38\u8BFB\u8D85\u65F6
ai.gateway.circuit-probe-timeout-ms=60000

# Dify \u914d\u7f6e\u4f18\u5148\u53d6\u6570\u636e\u5e93\uff08\u540e\u53f0\u300cDify\u914d\u7f6e\u7ba1\u7406\u300d\u7ef4\u62a4\uff09\u3002
# \u4e0b\u9762\u8fd9\u7ec4\u662f\u670d\u52a1\u7aef\u515c\u5e95\uff1a\u6570\u636e\u5e93\u672a\u914d\u7f6e\u65f6\u751f\u6548\uff0c\u901a\u8fc7\u73af\u5883\u53d8\u91cf\u6ce8\u5165\u5373\u53ef\uff0c\u7981\u6b62\u628a\u771f\u5b9e\u5bc6\u94a5\u5199\u8fdb\u4ed3\u5e93\u3002
ai.gateway.dify.chat.api-url=${DIFY_CHAT_URL:}
ai.gateway.dify.chat.api-key=${DIFY_CHAT_KEY:}
ai.gateway.dify.knowledge-chat.api-url=${DIFY_KB_CHAT_URL:}
ai.gateway.dify.knowledge-chat.api-key=${DIFY_KB_CHAT_KEY:}
ai.gateway.dify.file.api-url=${DIFY_KB_FILE_URL:}
ai.gateway.dify.file.api-key=${DIFY_KB_FILE_KEY:}

# 已下线的 QwenPaw 智能体转发配置（ai.gateway.agent.*）已从模板移除：
# 后端已无对应字段，保留只会让人误以为还需要填密钥。当前 Agent 工作台走
# modelsconfigbean 的直连模型配置，密钥只在服务端。

#============= SSO \u5355\u70B9\u767B\u5F55\uFF08OIDC\uFF09\u914D\u7F6E ==========================
# SSO \u5F00\u5173\uFF0Ctrue=\u542F\u7528\uFF0Cfalse=\u505C\u7528
sso.enabled=false
# SSO \u5E73\u53F0 OIDC \u670D\u52A1\u5730\u5740\uFF08Issuer URI\uFF09\uFF0C\u7528\u4E8E OpenID \u81EA\u52A8\u53D1\u73B0
sso.issuer-uri=http://<SSO_HOST>:8081/service/api/openapi/v1
# \u5728 SSO \u5E73\u53F0\u6CE8\u518C\u5E94\u7528\u540E\u5206\u914D\u7684\u5E94\u7528\u6807\u8BC6
sso.client-id=<\u6CE8\u518C\u83B7\u5F97\u7684Client ID>
# \u5728 SSO \u5E73\u53F0\u6CE8\u518C\u5E94\u7528\u540E\u5206\u914D\u7684\u5E94\u7528\u5BC6\u94A5
sso.client-secret=<你的Client Secret>
# SSO \u6388\u6743\u56DE\u8C03\u5730\u5740\uFF08\u672C\u7CFB\u7EDF\u5730\u5740\uFF09\uFF0C\u9700\u4E0E SSO \u5E73\u53F0\u6CE8\u518C\u7684 Redirect Uri \u5B8C\u5168\u4E00\u81F4
sso.callback-url=http://<\u6211\u4EEC\u670D\u52A1\u7684ip>:8507/ai/api/ssoTokenBean/callback

