name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: 前端 typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 流式回归检查
        run: npm run check:streaming
      # 2026-10-29 新增：这条此前一直没进 CI，而它在本地其实是失败的
      # （DOMPurify 需要 DOM 环境），也就是说这 10 条 XSS 断言从未真正跑过。
      # 现在用 jsdom 补上环境后可以跑通，接进 CI 防止再退化。
      - name: Markdown / XSS 消毒回归检查
        run: npm run check:markdown
      - name: 构建
        run: npm run build

  # 后端暂不进 CI：依赖私有框架 com.heneng.hnsp / blxt.qjava（不在 Maven Central），
  # 本地离线仓库 hd_redis/ai-maven/pro 也不入库。
  #
  # 恢复私服访问后，把下面这段取消注释即可接上（其余不用改）：
  #
  # backend:
  #   name: 后端编译 + 单元测试
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-java@v4
  #       with:
  #         distribution: temurin
  #         java-version: '8'   # 必须 8：Java 21 与项目 Lombok 版本不兼容
  #     - name: 编译并运行单元测试
  #       run: mvn -B test
  #       working-directory: backend/AIProject
  #
  # 注意两点：
  #   1. settings.xml 里要配置私服地址与凭据（用 GitHub Secrets 注入，不要写进仓库）；
  #   2. 目前后端单测覆盖率只覆盖鉴权/权限/SSO/网关 usage/本地 RAG，接入 CI 后
  #      每次改动都会被这层网兜住，补测试的收益会立刻显现。
  #
  # 在私服恢复前，本地改完后端请跑 scripts/verify.ps1（一条命令跑完后端测试 +
  # 前端 typecheck + 前端构建），它是后端质量目前唯一的门禁。
